<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Contact | Regal Cuts Barbershop
    </title>
    <meta name="description" content="Premium barbershop and grooming studio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div id="site-header">
    </div>
    <div class="page-head">
      <div class="wrap">
        <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">
          Contact Us
        </h1>
        <p>
          We would love to hear from you.
        </p>
      </div>
    </div>
    <section>
      <div class="wrap two">
        <div>
          <h2>
            Visit or Message Us
          </h2>
          <div class="contact-details">
            <p class="contact-detail">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-7.2 8-13a8 8 0 1 0-16 0c0 5.8 8 13 8 13zm0-10.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
              <span>Opposite prestige along item 7 Ogbomosho, Nigeria</span>
            </p>
            <p class="contact-detail">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.2 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .6 3.6 1 1 0 0 1-.2 1z"/></svg>
              <a href="tel:+2348033811028">+234 803 381 1028</a>
            </p>
          </div>
          <h3 style="margin-top:1.5rem">
            Opening Hours
          </h3>
          <p>
            Mon–Sat: 9am – 9pm
            <br>
            Sun: 12pm – 6pm
          </p>
          <div class="soc">
            <a href="https://www.instagram.com/zaccheaus_unisex_salon_and_spa?obrf=MWg2Ym9rdWx6d3cydw==" aria-label="Instagram">
              <svg class="icon-instagram" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".75"/></svg>
            </a>
            <a href="https://www.tiktok.com/@zaccheaus_unisex_salon_a?_r=1&_t=ZS-9B1iTybsYwU" aria-label="Tiktok">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 7.1a6.7 6.7 0 0 1-4.1-1.4v8.1a6.1 6.1 0 1 1-5.3-6.1v3.2a2.9 2.9 0 1 0 2.1 2.8V2.5h3.2c.2 2.2 1.8 4 4.1 4.3v.3z"/></svg>
            </a>
            <a href="https://snapchat.com/t/PzCLxCdp" aria-label="Snapchat">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2a4.8 4.8 0 0 0-4.8 4.8v2.6c-.7.5-1.5.6-2.3.4a.6.6 0 0 0-.3 1.1c.7.3 1.7.4 2.6.1.2.5.1 1-.1 1.5-.7 1.3-2 2.3-3.2 2.6a.6.6 0 0 0 .1 1.1c.9.2 1.3.7 1.6 1.1.4.5.9.8 1.7.8.3 0 .5.1.7.3.7.7 1.5 1 2.3 1s1.6-.3 2.3-1c.2-.2.4-.3.7-.3.8 0 1.3-.3 1.7-.8.3-.4.7-.9 1.6-1.1a.6.6 0 0 0 .1-1.1c-1.2-.3-2.5-1.3-3.2-2.6-.2-.5-.3-1-.1-1.5.9.3 1.9.2 2.6-.1a.6.6 0 0 0-.3-1.1c-.8.2-1.6.1-2.3-.4V7a4.8 4.8 0 0 0-4.8-4.8z"/></svg>
            </a>
          </div>
          <p style="margin-top:1.5rem">
            <a class="wa" data-wa href="#">
              Chat on WhatsApp
            </a>
          </p>
        </div>
        <form class="form" id="cf" style="grid-template-columns:1fr">
          <div class="notice">
            Submitting this form opens WhatsApp with your contact details and message ready to send.
          </div>
          <label>
            Name
            <input id="cn" name="name" autocomplete="name" required>
          </label>
          <label>
            Email
            <input id="ce" name="email" type="email" autocomplete="email">
          </label>
          <label>
            Message
            <textarea id="cm" name="message" rows="4" required>
            </textarea>
          </label>
          <button class="btn solid" type="submit">
            SEND
          </button>
        </form>
      </div>
    </section>
    <div id="site-footer">
    </div>
    <button id="top" aria-label="Back to top">
      &uarr;
    </button>
    <script src="js/script.js">
    </script>
  </body>
</html>
