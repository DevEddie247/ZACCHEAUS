<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Book Appointment | Regal Cuts Barbershop
    </title>
    <meta name="description" content="Premium barbershop and grooming studio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <body>
    <div id="site-header">
    </div>
    <div class="page-head">
      <div class="wrap">
        <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">
          Book an Appointment
        </h1>
        <p>
          Send your request to us on WhatsApp.
        </p>
      </div>
    </div>
    <section>
      <div class="wrap">
        <form id="booking-form" class="form" novalidate>
          <label>
            Full name *
            <input id="name" autocomplete="name">
            <span class="err">
            </span>
          </label>
          <label>
            Phone number *
            <input id="phone" type="tel" autocomplete="tel">
            <span class="err">
            </span>
          </label>
          <label>
            Email (optional)
            <input id="email" type="email" autocomplete="email">
            <span class="err">
            </span>
          </label>
          <label>
            Service *
            <select id="service">
            </select>
            <span class="err">
            </span>
          </label>
          <label>
            Appointment date *
            <input id="date" type="date">
            <span class="err">
            </span>
          </label>
          <label>
            Appointment time *
            <select id="time">
            </select>
            <span class="err">
            </span>
          </label>
          <label class="full">
            Additional notes (optional)
            <textarea id="notes" rows="3">
            </textarea>
          </label>
          <p class="full" style="font-size:.85rem">
            Times are preferences only. This site cannot check live availability, so our team will confirm manually.
          </p>
          <div id="note" class="notice full" role="status" hidden>
          </div>
          <div class="full">
            <button type="submit" class="wa">
              Book via WhatsApp
            </button>
          </div>
        </form>
      </div>
    </section>
    <div id="site-footer">
    </div>
    <button id="top" aria-label="Back to top">
      &uarr;
    </button>
    <script src="js/script.js">
    </script>
    <script src="js/booking.js">
    </script>
  </body>
</html>
